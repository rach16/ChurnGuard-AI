# The daily sync (ADR-0012 section 8, 1.11).
#
# Asks the backend to run a sync for every connection whose last success is
# older than a day. This is the schedule and the keep-alive in one: the org
# expires a refresh token idle for 30 days, and a scheduled run is a use.
#
# Why a workflow and not a timer in the process: the free tier sleeps after
# fifteen idle minutes, so a timer inside the service cannot fire when it is
# due. A scheduler outside the process is also the production shape (an
# EventBridge rule or Cloud Scheduler job hitting the same endpoint); GitHub
# Actions is the free stand-in.
#
# No secret (2.6.3, ADR-0013 §5). Each run asks GitHub for a short-lived OIDC
# token naming this repository, this workflow, the branch and the event, with
# the staging site as its audience; the backend verifies GitHub's signature and
# every claim, and accepts it on sync-due only. A fork, another workflow, another
# branch or a token for another deployment is refused. The shared operator key
# that used to sit in a repository secret is gone.
#
# Fails loudly when a connection needs a login or a run failed or broke a
# contract, and GitHub emails the repository owner on a failed scheduled run,
# the same alarm the heartbeat uses. Cadence is best effort (see heartbeat.yml);
# "once a day, roughly" is what the 30-day limit needs.

name: Daily sync

on:
  schedule:
    - cron: "0 13 * * *"      # 06:00 Pacific, roughly
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

# id-token: write lets the job request its OIDC token; nothing else is granted.
permissions:
  id-token: write
  contents: read

env:
  BACKEND: https://churnguard-backend-staging.onrender.com
  # The token's audience: the deployment's own site origin, which is what the
  # backend expects (PUBLIC_SITE_ORIGIN). A staging token opens staging only.
  AUDIENCE: https://churn-guard-ai-git-staging-rbanik16-gmailcoms-projects.vercel.app
  # A sleeping service pays a cold start before it can answer; then the run
  # itself is a few seconds.
  MAX_WAIT: 240
  ATTEMPTS: 3

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sync every connection that is due
        run: |
          set -uo pipefail
          # GitHub's token for this run. Fetched per attempt: it lives minutes.
          AUD=$(python3 -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['AUDIENCE'], safe=''))")
          oidc_token() {
            curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                 "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])"
          }
          URL="$BACKEND/connections/sync-due?wait=true"
          BODY=$(mktemp)
          CODE=000
          for attempt in $(seq 1 "$ATTEMPTS"); do
            TOKEN=$(oidc_token) || { echo "could not get an OIDC token from GitHub"; exit 1; }
            CODE=$(curl -s --max-time "$MAX_WAIT" -o "$BODY" -w '%{http_code}' \
                   -X POST -H "Authorization: Bearer $TOKEN" "$URL")
            echo "attempt $attempt/$ATTEMPTS: POST $URL -> $CODE"
            [ "$CODE" = "200" ] && break
            sleep $((attempt * 20))
          done
          echo "---"; cat "$BODY"; echo; echo "---"
          [ "$CODE" = "200" ] || { echo "the backend did not answer 200"; exit 1; }
          python3 - "$BODY" <<'PY'
          import json, sys
          body = json.load(open(sys.argv[1]))
          for c in body["connections"]:
              run = c.get("run") or {}
              print(f"{c['org_id']}: {c['action']}"
                    + (f" ({c['reason']})" if c.get("reason") else "")
                    + (f" -> {run['status']}, {run.get('records_fetched', 0)} records, "
                       f"{run.get('api_requests', 0)} API calls" if run else "")
                    + (f": {run['error']}" if run.get("error") else ""))
          if body["outcome"] != "ok":
              print("needs attention: see docs/RUNBOOK_SALESFORCE_CONNECTION.md, 'The morning email'")
              sys.exit(1)
          PY
