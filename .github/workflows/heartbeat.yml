# The alarm that the test suite cannot raise.
#
# On 2026-09-02 /ask was broken for about a day. Every test passed the whole
# time and every health check stayed green, because the failure only appears in
# a restarted container talking to a persisted index -- a condition CI does not
# reproduce and unit tests cannot see. Nothing was watching the running service,
# so the way it got found was a person typing a question.
#
# This runs against production and fails loudly when it cannot serve. GitHub
# emails the repository owner on a failed scheduled run, so no third-party
# monitoring account is needed and it costs nothing: the repository is public,
# so runner minutes are free.
#
# Cadence is 30 minutes, chosen for two reasons rather than one. Render's free
# tier sleeps after ~15 minutes idle, so a 30-minute gap lets it sleep and makes
# roughly every probe exercise a cold start -- which is exactly the path the
# outage lived on, and a 15-minute cadence would keep the service permanently
# awake and never test it. It also keeps usage near half of Render's 750 free
# instance-hours a month, instead of consuming all of them.

name: Heartbeat

on:
  schedule:
    # Every 30 minutes. GitHub runs scheduled jobs on a best-effort basis and
    # delays of several minutes are normal, which is fine for an availability
    # check and would not be for anything time-critical.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  # A late run and a fresh one probing at once tells us nothing extra.
  group: heartbeat
  cancel-in-progress: false

env:
  # The public entry point, not the backend directly. Probing the front door is
  # the point: it covers the Vercel rewrite as well as the service behind it, so
  # a broken proxy fails this too.
  SITE: https://churn-guard-ai-nine.vercel.app
  # A cold start on the free tier is ~30s and has been seen at 60s+ under load.
  MAX_WAIT: 120

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Readiness, including the AI stack
        run: |
          set -uo pipefail

          # require_ai_stack=true is the part that matters. The default asks only
          # whether the CSV-backed endpoints work, which stayed true throughout
          # the outage; this also demands that parent retrieval can actually
          # serve, which is what broke.
          URL="$SITE/api/ready?require_ai_stack=true"

          BODY=$(mktemp)
          CODE=$(curl -s --max-time "$MAX_WAIT" -o "$BODY" -w '%{http_code}' "$URL" || echo 000)

          echo "GET $URL -> $CODE"
          echo "--- response ---"
          cat "$BODY"
          echo

          if [ "$CODE" != "200" ]; then
            echo "::error::Service is not ready (HTTP $CODE). See the response above."
            exit 1
          fi

          # A 200 whose body says ready:false would be a contract bug in the
          # endpoint. Check the claim rather than trusting the status code.
          python3 - "$BODY" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))

          if not data.get("ready"):
              print("::error::HTTP 200 but ready=false:", json.dumps(data)[:500])
              sys.exit(1)

          problem = data.get("retrieval_problem")
          if problem:
              print(f"::error::retrieval_problem: {problem}")
              sys.exit(1)

          # Absence is not evidence of health. A backend without the probe --
          # a rollback, a stale image, a half-finished deploy -- would otherwise
          # sail through this check while nothing verified the join, which is
          # the same false green this workflow exists to prevent.
          components = data.get("components") or {}
          if "retrieval_join" not in components:
              print("::error::backend does not report retrieval_join; it predates "
                    "the readiness probe, so this check verified nothing")
              sys.exit(1)
          if not components["retrieval_join"]:
              print("::error::retrieval_join is false")
              sys.exit(1)

          print("ready=true, retrieval join verified intact")
          PY

      - name: Dashboard returns real numbers
        run: |
          set -uo pipefail

          # Readiness can be true while the data path returns nothing. This is
          # the check that would have caught the all-zeros dashboard: an empty
          # or zeroed response is a failure, not a valid answer.
          BODY=$(mktemp)
          CODE=$(curl -s --max-time "$MAX_WAIT" -o "$BODY" -w '%{http_code}' \
            "$SITE/api/dashboard-stats" || echo 000)

          echo "HTTP $CODE"
          cat "$BODY"
          echo

          if [ "$CODE" != "200" ]; then
            echo "::error::dashboard-stats returned HTTP $CODE"
            exit 1
          fi

          python3 - "$BODY" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          arr = d.get("total_arr_at_risk") or 0
          customers = d.get("total_active_customers") or 0
          if arr <= 0 or customers <= 0:
              print(f"::error::dashboard served zeros: arr={arr} customers={customers}")
              sys.exit(1)
          print(f"arr_at_risk={arr} active_customers={customers}")
          PY
