[project]
name = "customer-churn-rag"
version = "0.1.0"
description = "AI-powered customer churn prediction and analysis using RAG and LLM agents"
readme = "README.md"
requires-python = ">=3.12"
# Runtime only: what the API process actually imports to serve a request.
# Everything else moved to an extra -- see [project.optional-dependencies].
# The eval, notebook and plotting stack was ~450 MB of an image that never uses it.
dependencies = [
    # Reads the gold layer to serve the likelihood band and exposure. Embedded,
    # so no server and no credentials. Was warehouse-extra-only until the first
    # real deployment came up degraded without it.
    "duckdb>=1.1.0",

    # Web Framework
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # LangChain Core & Agents
    "langgraph>=0.2.69",
    "langchain>=0.3.19",
    "langchain-community>=0.3.16",
    "langchain-openai>=0.3.7",
    "langchain-experimental>=0.3.4",

    # LLM Providers
    "openai>=1.61.0",
    "langchain-cohere>=0.3.3",   # rag_retrievers.rerank_retrieval

    # Vector Database
    "qdrant-client>=1.13.2",
    "langchain-qdrant>=0.2.0",

    # Search & Retrieval
    "tavily-python>=0.5.0",      # tools/search_tools.py
    "rank-bm25>=0.2.2",          # core/rag_retrievers.hybrid_retrieval

    # Data
    "numpy>=2.2.2",
    "pandas>=2.0.0",
    "networkx>=3.0",             # core/knowledge_graph.py
]


[project.optional-dependencies]
# Survival model training AND inference. scikit-learn was removed from runtime in
# 2.5 as unused; that stopped being true in 7.2. Loading the fitted model
# unpickles a scikit-learn pipeline, so the serving image needs this extra too --
# without it /customer/{id}/likelihood and /book/exposure return 503 and the
# comment above is quietly wrong. Found on the first real deployment.
model = [
    "scikit-learn>=1.5.0",
    "joblib>=1.3.2",
]

# RAGAS evaluation. Pulls datasets and pyarrow (~128 MB), needed only to run evals.
evaluation = [
    "ragas==0.2.10",
    "tqdm>=4.66.0",
]

# Chart generation for notebooks and metrics reports.
visualization = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

# Interactive analysis. Never part of a served image.
notebook = [
    "jupyterlab>=4.0.6",
    "ipywidgets>=8.1.1",
]

warehouse = [
    # dbt only. duckdb moved to runtime dependencies -- the API queries the
    # warehouse to serve the likelihood band and the exposure figures, so it is
    # not an optional build-time tool. Kept listed here so `--extra warehouse`
    # still pulls everything a warehouse build needs.
    "duckdb>=1.1.0",
    "dbt-core>=1.9.0",
    "dbt-duckdb>=1.9.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

