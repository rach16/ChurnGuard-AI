# Render blueprint: the backend as a free web service.
#
# Free tier means 512 MB of RAM and a sleep after ~15 minutes idle, so the first
# request after a quiet spell takes about 30 seconds. The app uses ~122 MB, so
# memory is not the constraint.
#
# Everything the demo shows -- the queue, risk bands, exposure, evidence, plays --
# reads local data and works with no external service. Only the AI question box
# needs OPENAI_API_KEY and Qdrant.
services:
  - type: web
    name: churnguard-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: .
    # The image has a jupyter stage too; build only the backend.
    dockerCommand: uv run python /app/src/backend/api.py

    # /health is liveness and answers even when the AI stack is down, which is
    # what a platform health check should judge. /ready would fail the deploy
    # whenever OPENAI_API_KEY is absent, and absent is a valid configuration.
    healthCheckPath: /health

    envVars:
      # Render assigns PORT; the app now reads it.
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: CHURNGUARD_DATA_DIR
        value: data

      # Set in the dashboard, not here. ':memory:' works but rebuilds the index
      # on every wake -- 771 documents embedded, about a cent and ~60s of a
      # ~66s measured cold start. A hosted Qdrant holds the index between wakes,
      # so the service only connects.
      - key: QDRANT_URL
        sync: false

      # Spend ceilings. The daily budget is the real one -- a per-visitor limit
      # caps one person, not a crowd.
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: MAX_QUESTION_CHARS
        value: "2000"
      - key: LLM_RATE_LIMIT_PER_HOUR
        value: "10"
      - key: LLM_DAILY_BUDGET
        value: "200"

      # Set by hand in the Render dashboard, never in this file -- it is public.
      # Leave OPENAI_API_KEY unset and the site still works; only the AI question
      # box reports itself unavailable.
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_API_KEY
        sync: false

      # No API_KEYS: a public demo cannot ask a visitor for a credential. The
      # rate limits above are what protect it instead.

  # Staging: the same service built from the `staging` branch, so a change can
  # be seen running before it reaches the live site. DEPLOYMENT_SPEC.md Step 3.
  #
  # Free hours are pooled: 750 a month across every free service in the
  # workspace. Production uses roughly half (the heartbeat lets it sleep between
  # probes). Staging sleeps unless something is hitting it, so it costs hours
  # only while it is being used. If production is ever kept permanently awake
  # by an external pinger (~730 h), there is no room left for this service and
  # Render suspends both until the month ends. Watch the hours, not the price.
  #
  # Starts on the synthetic data, same as production, so the first thing staging
  # proves is the pipeline itself. Switch CHURNGUARD_DATA_DIR here to try the
  # Salesforce data; the image carries only the synthetic warehouse and model
  # (see src/backend/Dockerfile, artifacts stage), so that switch is expected to
  # fail until the build produces both. That failure is what staging is for.
  - type: web
    name: churnguard-backend-staging
    runtime: docker
    plan: free
    region: oregon
    branch: staging
    autoDeploy: true
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: .
    dockerCommand: uv run python /app/src/backend/api.py
    healthCheckPath: /health
    envVars:
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: CHURNGUARD_DATA_DIR
        value: data
      # Shared with production: one free Qdrant cluster, and the index is read,
      # never rebuilt, at startup. Never set REINDEX_ON_START here.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: MAX_QUESTION_CHARS
        value: "2000"
      - key: LLM_RATE_LIMIT_PER_HOUR
        value: "10"
      - key: LLM_DAILY_BUDGET
        value: "200"
      # Deliberately absent on staging: OPENAI_API_KEY. Everything except the AI
      # question box works without it, and staging should not be able to spend.
