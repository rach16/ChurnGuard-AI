# Render blueprint: the backend as a free web service.
#
# Free tier means 512 MB of RAM and a sleep after ~15 minutes idle, so the first
# request after a quiet spell takes about 30 seconds. The app uses ~122 MB, so
# memory is not the constraint.
#
# Everything the demo shows -- the queue, risk bands, exposure, evidence, plays --
# reads local data and works with no external service. Only the AI question box
# needs OPENAI_API_KEY and Qdrant.
services:
  - type: web
    name: churnguard-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: .
    # The image has a jupyter stage too; build only the backend.
    dockerCommand: uv run python /app/src/backend/api.py

    # /health is liveness and answers even when the AI stack is down, which is
    # what a platform health check should judge. /ready would fail the deploy
    # whenever OPENAI_API_KEY is absent, and absent is a valid configuration.
    healthCheckPath: /health

    envVars:
      # Render assigns PORT; the app now reads it.
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      # The live site shows integration data only (1.8). The synthetic set is test
      # data; set this back to `data` to roll back, which is a restart, not a rebuild.
      - key: CHURNGUARD_DATA_DIR
        value: data/salesforce

      # Set in the dashboard, not here. ':memory:' works but rebuilds the index
      # on every wake -- 771 documents embedded, about a cent and ~60s of a
      # ~66s measured cold start. A hosted Qdrant holds the index between wakes,
      # so the service only connects.
      - key: QDRANT_URL
        sync: false

      # Spend ceilings. The daily budget is the real one -- a per-visitor limit
      # caps one person, not a crowd.
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: MAX_QUESTION_CHARS
        value: "2000"
      - key: LLM_RATE_LIMIT_PER_HOUR
        value: "10"
      - key: LLM_DAILY_BUDGET
        value: "200"

      # Set by hand in the Render dashboard, never in this file -- it is public.
      # Leave OPENAI_API_KEY unset and the site still works; only the AI question
      # box reports itself unavailable.
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_API_KEY
        sync: false

      # No API_KEYS: a public demo cannot ask a visitor for a credential. The
      # rate limits above are what protect it instead.

  # Staging: the same service built from the `staging` branch, so a change can
  # be seen running before it reaches the live site. DEPLOYMENT_SPEC.md Step 3.
  #
  # Free hours are pooled: 750 a month across every free service in the
  # workspace. Production uses roughly half (the heartbeat lets it sleep between
  # probes). Staging sleeps unless something is hitting it, so it costs hours
  # only while it is being used. If production is ever kept permanently awake
  # by an external pinger (~730 h), there is no room left for this service and
  # Render suspends both until the month ends. Watch the hours, not the price.
  #
  # Serves the Salesforce data, which is what the site shows once 1.8 reaches
  # production. Production keeps the synthetic set until that switch is approved.
  - type: web
    name: churnguard-backend-staging
    runtime: docker
    plan: free
    region: oregon
    branch: staging
    autoDeploy: true
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: .
    dockerCommand: uv run python /app/src/backend/api.py
    healthCheckPath: /health
    envVars:
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: CHURNGUARD_DATA_DIR
        value: data/salesforce
      # Shared with production: one free Qdrant cluster, and the index is read,
      # never rebuilt, at startup. Never set REINDEX_ON_START here.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: MAX_QUESTION_CHARS
        value: "2000"
      - key: LLM_RATE_LIMIT_PER_HOUR
        value: "10"
      - key: LLM_DAILY_BUDGET
        value: "200"
      # OPENAI_API_KEY on staging since 2026-10-18 (ADR-0016, decision 4): the
      # assistant is built and proven here first. Set by hand in the dashboard;
      # spend is bounded by the two limits above and the OpenAI dashboard cap.
      - key: OPENAI_API_KEY
        sync: false

      # Log in with Salesforce (1.9, ADR-0012). All set by hand in the dashboard.
      # Staging only until the live-site decision; production has none of these,
      # so it reports `connections` as off rather than failing.
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      # Neon, branch `staging`, direct connection. Production would use its own
      # branch and, for a customer, RDS.
      - key: DATABASE_URL
        sync: false
      # AWS KMS key alias/churnguard-staging-master in us-west-2, reached as an IAM
      # user limited to GenerateDataKey, Decrypt, ReEncrypt* and DescribeKey on it.
      - key: CHURNGUARD_KMS_KEY_ID
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # The staging preview's origin: the OAuth callbacks' address, and the
      # audience the daily workflow's GitHub OIDC token must carry (2.6.3).
      - key: PUBLIC_SITE_ORIGIN
        sync: false
      # Operator sign-in (2.6, ADR-0013): the staging Cognito user pool and its
      # confidential app client. The secret is held only here.
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false
      - key: COGNITO_CLIENT_SECRET
        sync: false
      - key: COGNITO_DOMAIN
        sync: false
      # Self sign-up to the read-only demo (2.6.7, ADR-0017): "true" opens it;
      # the pool must allow sign-up too. The demo line links to the contacts.
      - key: SELF_SIGNUP
        sync: false
      - key: CONTACT_LINKEDIN
        sync: false
      - key: CONTACT_EMAIL
        sync: false
